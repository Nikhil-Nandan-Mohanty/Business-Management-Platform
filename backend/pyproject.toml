[project]
name = "backend"
version = "0.1.0"
description = "Business Management Platform Backend"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.138.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "redis>=6.0.0",
    "uvicorn[standard]>=0.49.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]
